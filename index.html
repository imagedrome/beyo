<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beyo — AI Countdown &amp; Event Preparation</title>
  <meta name="description" content="Turn screenshots, photos and text into events, countdowns, reminders and preparation plans with AI.">
  <meta name="keywords" content="Beyo, AI countdown, countdown app, AI event extraction, event reminder, event preparation, screenshot to event, photo to event">
  <link rel="canonical" href="https://beyo.day/">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#d7bc60">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beyo">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="https://beyo.day/">
  <meta property="og:title" content="Beyo — AI Countdown &amp; Event Preparation">
  <meta property="og:description" content="Beyo turns screenshots, photos and text into events, countdowns, reminders and preparation plans.">
  <meta property="og:image" content="https://beyo.day/assets/images/og-share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Beyo — AI Countdown &amp; Event Preparation">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Beyo — AI Countdown &amp; Event Preparation">
  <meta name="twitter:description" content="Beyo turns screenshots, photos and text into events, countdowns, reminders and preparation plans.">
  <meta name="twitter:image" content="https://beyo.day/assets/images/og-share.png">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Beyo",
    "url": "https://beyo.day/",
    "description": "Turn screenshots, photos and text into events, countdowns, reminders and preparation plans with AI.",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "iOS",
    "image": "https://beyo.day/assets/images/og-share.png",
    "downloadUrl": "https://apps.apple.com/app/beyo/id1397284424",
    "installUrl": "https://apps.apple.com/app/beyo/id1397284424",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Broong Inc.",
      "url": "https://broong.com"
    }
  }
  </script>
</head>
<body class="home">

  <main class="poster">
    <img
      class="poster-title"
      src="/assets/images/site_title@2x.png"
      width="760"
      height="168"
      alt="Beyo — AI Countdown"
      decoding="async"
    >

    <div class="poster-shots" aria-label="App screenshots">
      <img
        src="/assets/images/image01@2x.png"
        width="270"
        height="587"
        alt="Beyo home screen with event countdowns"
        decoding="async"
      >
      <img
        src="/assets/images/image02@2x.png"
        width="270"
        height="587"
        alt="Beyo event detail with countdown and reminders"
        decoding="async"
      >
      <img
        src="/assets/images/image03@2x.png"
        width="270"
        height="587"
        alt="Beyo preparation checklist for an upcoming event"
        decoding="async"
      >
      <img
        src="/assets/images/image04@2x.png"
        width="270"
        height="587"
        alt="Beyo capturing an event from a photo or screenshot"
        decoding="async"
      >
    </div>

    <a
      class="poster-icon-link"
      href="https://apps.apple.com/app/beyo/id1397284424"
      aria-label="Download Beyo on the App Store"
    >
      <img
        class="poster-icon"
        src="/assets/images/app_icon@2x.png"
        width="90"
        height="90"
        alt="Beyo app icon"
        decoding="async"
      >
    </a>

    <a
      class="poster-badge"
      href="https://apps.apple.com/app/beyo/id1397284424"
      aria-label="Download on the App Store"
    >
      <img
        src="/assets/images/appstore.svg"
        width="120"
        height="40"
        alt="Download on the App Store"
        decoding="async"
      >
    </a>

    <a
      class="poster-copy-link"
      href="https://broong.com"
      aria-label="Broong Inc."
    >
      <img
        class="poster-copy"
        src="/assets/images/allrightsreserved@2x.png"
        width="370"
        height="21"
        alt="© 2026 Broong Inc. All rights reserved."
        decoding="async"
      >
    </a>

    <a class="poster-privacy" href="/privacy/" aria-label="Privacy Policy">
      <img
        src="/assets/images/privacy@2x.png"
        width="133"
        height="21"
        alt="Privacy Policy"
        decoding="async"
      >
    </a>

    <a class="poster-email" href="#" aria-label="Email Broong Inc." id="poster-email">
      <img
        src="/assets/images/email@2x.png"
        width="38"
        height="26"
        alt="Email"
        decoding="async"
      >
    </a>
  </main>

  <script>
    (function () {
      var el = document.getElementById("poster-email");
      if (!el) return;
      el.addEventListener("click", function (e) {
        e.preventDefault();
        window.location.href = "mailto:" + "info" + "@" + "broong.com";
      });
    })();
  </script>
</body>
</html>
